<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICICI Lombard — Insurance Training Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Mulish', sans-serif;
            background: linear-gradient(135deg, #005B75, #003D50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container { width: 100%; max-width: 400px; }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-logo { text-align: center; margin-bottom: 24px; }
        .login-logo svg { margin-bottom: 12px; }
        .login-title { font-size: 22px; font-weight: 700; color: #B02A30; text-align: center; margin-bottom: 4px; }
        .login-subtitle { font-size: 14px; color: #5a6370; text-align: center; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block; font-size: 12px; font-weight: 600; color: #5a6370;
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.4px;
        }
        .form-group input {
            width: 100%; padding: 12px 14px; border-radius: 8px;
            border: 1px solid #e0e4e8; background: #f8f9fa; color: #1a1a2e;
            font-size: 14px; font-family: inherit; transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #005B75; background: #fff; }
        .form-group input::placeholder { color: #b0b8c1; }
        .btn-signin {
            width: 100%; padding: 13px; border: none; border-radius: 8px;
            background: #005B75; color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-top: 8px; font-family: inherit;
        }
        .btn-signin:hover { background: #004a60; }
        .btn-signin:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            background: #fdecea; border: 1px solid #f5c6cb;
            color: #721c24; padding: 10px 14px; border-radius: 8px;
            font-size: 13px; margin-bottom: 16px; display: none; text-align: center;
        }
        .error-msg.show { display: block; }
        .disclaimer {
            text-align: center; margin-top: 20px; font-size: 10px; color: #8a94a0;
            line-height: 1.5; padding: 0 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <svg width="56" height="56" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="8" fill="#B02A30"/>
                    <path d="M10 28 Q20 12 30 28" stroke="#F99D27" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M10 32 Q20 18 30 32" stroke="#F99D27" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
                    <circle cx="20" cy="14" r="3" fill="#F99D27"/>
                </svg>
            </div>
            <div class="login-title">ICICI Lombard</div>
            <div class="login-subtitle">Insurance Training Portal</div>

            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-signin">Sign In</button>
            </form>

            <p class="disclaimer">Internal & Confidentiality Notice — This portal and its contents are intended solely for internal use by authorized personnel of ICICI Lombard General Insurance Company Ltd. Unauthorized access, distribution, or reproduction is strictly prohibited.</p>
        </div>
    </div>

    <script>
        // Redirect if already logged in
        (function() {
            var s = localStorage.getItem('ilSession');
            if (s && JSON.parse(s).username) {
                window.location.href = '/dashboard';
            }
        })();

        // Initialize default users if not exists
        (function() {
            var users = JSON.parse(localStorage.getItem('ilManagedUsers') || 'null');
            if (!users) {
                users = [
                    { username: 'admin', password: 'Admin@123', role: 'admin', isDefault: true, email: 'admin@icicilombard.com', createdAt: new Date().toISOString() },
                    { username: 'user', password: 'User@123', role: 'user', isDefault: true, email: 'user@icicilombard.com', createdAt: new Date().toISOString() }
                ];
                localStorage.setItem('ilManagedUsers', JSON.stringify(users));
            }
        })();

        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('errorMsg').classList.remove('show');

            var username = document.getElementById('loginUsername').value.trim().toLowerCase();
            var password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('Please enter both username and password');
                return;
            }

            var users = JSON.parse(localStorage.getItem('ilManagedUsers') || '[]');
            var matched = users.find(function(u) {
                return u.username.toLowerCase() === username && u.password === password;
            });

            if (!matched) {
                showError('Invalid username or password');
                return;
            }

            // Store session
            var session = { username: matched.username, role: matched.role, email: matched.email, loginTime: new Date().toISOString() };
            localStorage.setItem('ilSession', JSON.stringify(session));

            // Log login event
            var logs = JSON.parse(localStorage.getItem('ilLoginLogs') || '[]');
            logs.unshift({ username: matched.username, role: matched.role, action: 'Login', timestamp: new Date().toISOString() });
            if (logs.length > 100) logs.pop();
            localStorage.setItem('ilLoginLogs', JSON.stringify(logs));

            // Redirect to dashboard
            window.location.href = '/dashboard';
        });
    </script>
</body>
</html>
