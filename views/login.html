<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICICI Lombard — Marine Insurance Training Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container { width: 100%; max-width: 400px; }
        .login-header { text-align: center; margin-bottom: 28px; }
        .login-logo { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
        .login-logo svg { flex-shrink: 0; }
        .login-logo .brand-text { text-align: left; }
        .login-logo .brand-name { font-size: 20px; font-weight: 700; color: #B02A30; display: block; }
        .login-logo .brand-sub { font-size: 11px; color: #5a6370; display: block; letter-spacing: 0.3px; margin-top: 2px; }
        .login-header p { color: #5a6370; font-size: 13px; margin-top: 6px; }
        .login-card {
            background: white;
            border: 1px solid #e8ecef;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .tabs { display: flex; margin-bottom: 22px; background: #f8f9fa; border-radius: 8px; padding: 4px; }
        .tab-btn {
            flex: 1; padding: 9px; border: none; background: transparent;
            color: #5a6370; font-size: 13px; font-weight: 500; cursor: pointer;
            border-radius: 6px; transition: all 0.2s;
        }
        .tab-btn.active { background: #B02A30; color: white; box-shadow: 0 1px 4px rgba(176,42,48,0.3); }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block; font-size: 11px; font-weight: 600; color: #5a6370;
            margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px;
        }
        .form-group input {
            width: 100%; padding: 11px 14px; border-radius: 8px;
            border: 1px solid #e8ecef; background: #fafbfc; color: #1a1a2e;
            font-size: 14px; font-family: inherit; transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #B02A30; background: white; }
        .form-group input::placeholder { color: #b0b8c1; }
        .btn-submit {
            width: 100%; padding: 12px; border: none; border-radius: 8px;
            background: #B02A30; color: white; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.2s; margin-top: 6px;
        }
        .btn-submit:hover { background: #8f2226; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .error-msg {
            background: #fdecea; border: 1px solid #f5c6cb;
            color: #721c24; padding: 9px 12px; border-radius: 8px;
            font-size: 12px; margin-bottom: 14px; display: none;
        }
        .error-msg.show { display: block; }
        .form-panel { display: none; }
        .form-panel.active { display: block; }
        .footer-text { text-align: center; margin-top: 18px; font-size: 11px; color: #8a94a0; }
        .powered-by { text-align: center; font-size: 10px; color: #b0b8c1; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <svg width="44" height="44" viewBox="0 0 40 40" fill="none">
                    <rect width="40" height="40" rx="8" fill="#B02A30"/>
                    <path d="M10 28 Q20 12 30 28" stroke="#F99D27" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M10 32 Q20 18 30 32" stroke="#F99D27" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
                    <circle cx="20" cy="14" r="3" fill="#F99D27"/>
                </svg>
                <div class="brand-text">
                    <span class="brand-name">ICICI Lombard</span>
                    <span class="brand-sub">Marine Insurance Training Portal</span>
                </div>
            </div>
            <p>Interactive Learning & Assessment Platform</p>
        </div>

        <div class="login-card">
            <div class="tabs">
                <button class="tab-btn active" data-panel="login">Sign In</button>
                <button class="tab-btn" data-panel="register">Register</button>
            </div>

            <div class="error-msg" id="errorMsg"></div>

            <div class="form-panel active" id="loginPanel">
                <form id="loginForm">
                    <div class="form-group">
                        <label>User ID</label>
                        <input type="text" id="loginUsername" placeholder="Enter your user ID" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>
            </div>

            <div class="form-panel" id="registerPanel">
                <form id="registerForm">
                    <div class="form-group">
                        <label>User ID</label>
                        <input type="text" id="regUsername" placeholder="Choose a user ID" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>Display Name</label>
                        <input type="text" id="regDisplayName" placeholder="Your full name">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPassword" placeholder="Create a password" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn-submit">Create Account</button>
                </form>
            </div>
        </div>
        <p class="footer-text">Incoterms 2020 & Marine Insurance Clauses</p>
        <p class="powered-by">ICICI Lombard General Insurance Company Limited</p>
    </div>

    <script>
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.panel + 'Panel').classList.add('active');
                document.getElementById('errorMsg').classList.remove('show');
            });
        });

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.classList.add('show');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-submit');
            btn.disabled = true; btn.textContent = 'Signing in...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: document.getElementById('loginUsername').value.trim(), password: document.getElementById('loginPassword').value })
                });
                const data = await res.json();
                if (data.success) window.location.href = data.redirect;
                else showError(data.error);
            } catch (err) { showError('Connection error. Please try again.'); }
            btn.disabled = false; btn.textContent = 'Sign In';
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('.btn-submit');
            btn.disabled = true; btn.textContent = 'Creating account...';
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: document.getElementById('regUsername').value.trim(), password: document.getElementById('regPassword').value, displayName: document.getElementById('regDisplayName').value.trim() })
                });
                const data = await res.json();
                if (data.success) window.location.href = data.redirect;
                else showError(data.error);
            } catch (err) { showError('Connection error. Please try again.'); }
            btn.disabled = false; btn.textContent = 'Create Account';
        });
    </script>
</body>
</html>
